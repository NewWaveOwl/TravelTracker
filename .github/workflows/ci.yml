name: ci

on:
  pull_request:

# cancel superseded runs so only the newest commit burns runner time
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet build TravelTracker.Tests.slnx --configuration Release
      - run: dotnet test TravelTracker.Tests.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results
      # publish results even when tests fail so reviewers can inspect them
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
