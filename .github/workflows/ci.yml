name: ci

on:
  pull_request:

# cancel superseded runs so only the newest commit burns runner time
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      # Disposable runner-local test instance only; never point this at production.
      TRAVELTRACKER_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Build (warnings fail the build)
        run: dotnet build TravelTracker.Tests.slnx --configuration Release
      - name: Application and domain tests (EF InMemory, no PostgreSQL connection)
        env:
          TRAVELTRACKER_TEST_POSTGRES: ""
        run: dotnet test TravelTracker.Tests.slnx --configuration Release --no-build --filter "Category!=PostgreSQL" --logger "trx;LogFileName=application.trx" --results-directory test-results
      - name: PostgreSQL relational tests
        run: dotnet test TravelTracker.Tests.slnx --configuration Release --no-build --filter "Category=PostgreSQL" --logger "trx;LogFileName=postgresql.trx" --results-directory test-results
      # publish results even when tests fail so reviewers can inspect them
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
