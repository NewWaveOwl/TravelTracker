name: ci

on:
  pull_request:

# cancel superseded runs so only the newest commit burns runner time
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      # Disposable runner-local test instance only; never point this at production.
      TRAVELTRACKER_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Build (warnings fail the build)
        run: dotnet build TravelTracker.Tests.slnx --configuration Release
      - name: Smoke test each service host alone (every other host stopped)
        env:
          SMOKE_LOGS: smoke-logs
        run: scripts/smoke-hosts.sh
      - name: Bootstrap and migrate the six service databases
        env:
          SMOKE_LOGS: smoke-logs/supabase-layout
          SMOKE_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres
        run: |
          psql -X -h 127.0.0.1 -U postgres -d postgres -f src/Database/supabase-bootstrap.sql
          scripts/smoke-hosts.sh
          for service in users attractions transport accommodations settings trips; do
            count=$(psql -X -h 127.0.0.1 -U postgres -d "traveltracker_$service" -Atc 'SELECT count(*) FROM public."__EFMigrationsHistory"')
            test "$count" -gt 0
          done
      - name: Application and domain tests (EF InMemory, no PostgreSQL connection)
        env:
          TRAVELTRACKER_TEST_POSTGRES: ""
        run: dotnet test TravelTracker.Tests.slnx --configuration Release --no-build --filter "Category!=PostgreSQL" --logger "trx;LogFilePrefix=application" --results-directory test-results
      - name: PostgreSQL relational tests
        run: dotnet test TravelTracker.Tests.slnx --configuration Release --no-build --filter "Category=PostgreSQL" --logger "trx;LogFilePrefix=postgresql" --results-directory test-results
      - name: Supabase access-token hook permissions (disposable database)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
        run: |
          # GitHub's editor can retain CRLF in an existing script despite eol=lf.
          sed -i 's/\r$//' scripts/test-supabase-auth-hook.sh
          bash scripts/test-supabase-auth-hook.sh
      # publish results even when tests fail so reviewers can inspect them
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results
            smoke-logs
